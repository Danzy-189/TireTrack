modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "tiretracks"
version = "3.1.0"
displayName = "TireTracks"
authors = "Danzy"
description = '''
Wheels from Create Aeronautics (Offroad / Sable / Simulated) leave real marks on the world.
Ground wears down stage by stage into a rut, from turf to a footpath to coarse dirt to mud,
gravel or sand, and a soaked rut can fill with water or freeze into ice.
Snow is not eaten but driven into the ground as ice and polished into a packed ice road.
Wheels throw up water, snow, dust or clods and drag mud onto clean ground for a few blocks.
Which blocks count as which surface is decided by block tags, so any pack can extend it.
Everything is silent and applies no effects to players: only blocks and particles.
'''

[[mixins]]
config = "tiretracks.mixins.json"

[[dependencies.tiretracks]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.tiretracks]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

# Soft deps: the mixin is @Pseudo, so a wrong/absent mod id just makes TireTracks idle
# instead of refusing to launch. Load AFTER them so our mixin applies on top.
[[dependencies.tiretracks]]
    modId = "sable"
    type = "optional"
    versionRange = "[1.2.2,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tiretracks]]
    modId = "simulated"
    type = "optional"
    versionRange = "[1.2.1,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tiretracks]]
    modId = "offroad"
    type = "optional"
    versionRange = "[1.2.1,)"
    ordering = "AFTER"
    side = "BOTH"
